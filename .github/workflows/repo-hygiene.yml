name: Harness Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python@v7.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install package with test extras
        run: python3.12 -m pip install -e ".[test]"
      # Hygiene must run BEFORE the canon checkout below: it rglobs the repo tree,
      # and the context-repository working copy would otherwise be scanned as if it
      # were harness content.
      # Check out the canonical L1 schemas so the drift guard can compare the
      # harness's vendored bundle against real canon on the runner (not only where
      # a workspace checkout happens to exist). Tracked at `main` on purpose: if
      # canon advances past the pinned bundle, the drift test goes red and tells
      # you to run scripts/refresh_discovery_schema_bundle.py. A deterministic pin
      # equal to the bundle's origin would make the guard vacuous.
      - name: Check out canonical context-repository (schema drift guard)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: evanfollis/context-repository
          ref: main
          path: _canon
      - name: Run canonical gate
        env:
          SKILLFOUNDRY_CANON_SCHEMA_DIR: ${{ github.workspace }}/_canon/spec/discovery-framework/schemas
        run: make check
