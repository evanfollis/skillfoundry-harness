[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillfoundry-harness"
version = "0.1.0"
description = "Harness package for Skillfoundry agents and context repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20",
    "referencing>=0.30",
]

[project.optional-dependencies]
# Test-only dependencies. tests/conftest.py and tests/test_discovery_adapter.py
# are pytest-native (autouse fixtures, tmp_path, pytest.raises), so the suite is
# run with pytest. Kept out of the runtime `dependencies` so `pip install -e .`
# for production use stays lean; CI installs `.[test]`.
test = [
    "pytest>=8",
    "ruff==0.16.0",
]

# Ruff 0.16 expanded its implicit defaults from the historical Pyflakes/pycodestyle
# baseline to hundreds of additional rules. Keep the harness policy explicit so
# dependency releases cannot silently redefine the gate; lint-policy expansion is
# reviewed separately from tool maintenance.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.scripts]
skillfoundry = "skillfoundry_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillfoundry_harness = ["schemas/*.json", "schemas/discovery/*.json"]
